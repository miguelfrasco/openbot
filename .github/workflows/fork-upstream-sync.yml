name: Fork upstream sync

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write

env:
  FORK_RELEASE_BRANCH: miguel-release
  UPSTREAM_REPO: nightly-labs/openbot

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Add upstream remote
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream --tags --force
          git fetch origin --force

      - name: Find newest upstream release tag
        id: tag
        run: |
          tag="$(git for-each-ref --sort=-v:refname --format='%(refname:short)' "refs/tags/v*" | head -n 1)"
          [ -n "$tag" ] || { echo "No upstream release tag found." >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Upstream tag: $tag"

      - name: Skip when sync branch already exists
        id: skip
        run: |
          branch="auto/${{ steps.tag.outputs.tag }}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase fork commits onto upstream tag
        if: steps.skip.outputs.skip != 'true'
        id: rebase
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          work_branch="auto/$tag"
          git checkout -B "$work_branch" "$tag"
          commits="$(git rev-list --reverse "$tag..origin/main" || true)"
          if [ -z "$commits" ]; then
            echo "rebase_conflict=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cherry-pick $commits; then
            git cherry-pick --abort || true
            echo "rebase_conflict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "rebase_conflict=false" >> "$GITHUB_OUTPUT"

      - name: Install and test
        if: steps.skip.outputs.skip != 'true' && steps.rebase.outputs.rebase_conflict != 'true'
        run: |
          bun install --frozen-lockfile
          bun run test:related -- src/backend/agent/auto-model/auto-model.router.test.ts
          bun run typecheck:node

      - name: Fast-forward release branch
        if: steps.skip.outputs.skip != 'true' && steps.rebase.outputs.rebase_conflict != 'true'
        run: |
          git push -u origin "auto/${{ steps.tag.outputs.tag }}"
          git branch -f "$FORK_RELEASE_BRANCH" "auto/${{ steps.tag.outputs.tag }}"
          git push -f origin "$FORK_RELEASE_BRANCH"

      - name: Build linux arm64 AppImage
        if: steps.skip.outputs.skip != 'true' && steps.rebase.outputs.rebase_conflict != 'true'
        run: bun run dist:linux:arm64

      - name: Upload server release artifacts
        if: steps.skip.outputs.skip != 'true' && steps.rebase.outputs.rebase_conflict != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openbot-linux-arm64-${{ steps.tag.outputs.tag }}
          path: |
            dist/*.AppImage
            dist/latest-linux-arm64.yml
            dist/SHA256SUMS-linux-arm64.txt

      - name: Set up Docker buildx
        if: steps.skip.outputs.skip != 'true' && steps.rebase.outputs.rebase_conflict != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Publish Docker image to GHCR
        if: steps.skip.outputs.skip != 'true' && steps.rebase.outputs.rebase_conflict != 'true'
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: miguelfrasco/openbot
        run: |
          appimage="$(echo dist/*.AppImage)"
          cp "$appimage" docker/OpenBot.AppImage
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          docker buildx build \
            --platform linux/arm64 \
            --file docker/Dockerfile \
            --tag "$REGISTRY/$IMAGE_NAME:${{ steps.tag.outputs.tag }}" \
            --tag "$REGISTRY/$IMAGE_NAME:latest" \
            --push \
            docker

      - name: Open sync failure issue
        if: steps.skip.outputs.skip != 'true' && steps.rebase.outputs.rebase_conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "${{ steps.tag.outputs.tag }}";
            const title = `Upstream sync failed for ${tag}`;
            const body = [
              "The scheduled fork sync could not cherry-pick `main` onto `" + tag + "`.",
              "",
              "The last good `miguel-release` build was left unchanged.",
              "",
              "Resolve conflicts on branch `auto/" + tag + "` locally, then push and fast-forward `miguel-release`."
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["upstream-sync"]
            });